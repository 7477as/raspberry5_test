name: Android GATT RTT APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'kotlin/bluetooth/ble/gattc_rtt/**'
      - '.github/workflows/android-gattc.yml'
  pull_request:
    paths:
      - 'kotlin/bluetooth/ble/gattc_rtt/**'
      - '.github/workflows/android-gattc.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kotlin/bluetooth/ble/gattc_rtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon assembleDebug
      - run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/gattc-debug.apk
          cd build/artifacts
          sha256sum gattc-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gattc-debug-apk
          path: kotlin/bluetooth/ble/gattc_rtt/build/artifacts/
