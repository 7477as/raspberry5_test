name: Android SPP client APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'kotlin/bluetooth/classic/sppc_rtt/**'
      - '.github/workflows/android-sppc.yml'
  pull_request:
    paths:
      - 'kotlin/bluetooth/classic/sppc_rtt/**'
      - '.github/workflows/android-sppc.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kotlin/bluetooth/classic/sppc_rtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug
      - run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/sppc-debug.apk
          sha256sum build/artifacts/sppc-debug.apk > build/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sppc-debug-apk
          path: kotlin/bluetooth/classic/sppc_rtt/build/artifacts/
          retention-days: 30
